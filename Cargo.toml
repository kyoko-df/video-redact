[workspace]
members = [
    "crates/video-redact-cli",
    "crates/video-redact-core",
    "crates/video-redact-cuda",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
video-redact-core = { path = "crates/video-redact-core" }
video-redact-cuda = { path = "crates/video-redact-cuda" }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

